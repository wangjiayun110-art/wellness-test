  <script>
    (function () {
      const TYPES = window.WellnessData.TYPES;
      const ORDER = ['pinghe','qixu','yangxu','yinxu','tanoshi','shire','xueyu','qiyu','teying'];
      const sel = document.getElementById('typeSelector');
      const content = document.getElementById('guideContent');

      function getActiveId() {
        const hash = (location.hash || '').replace('#', '');
        return ORDER.includes(hash) ? hash : 'pinghe';
      }

      function renderSelector(active) {
        sel.innerHTML = ORDER.map((id) => {
          const t = TYPES[id];
          return `
            <a href="#${id}"
               class="type-pill ${id === active ? 'is-active' : ''}"
               style="--accent:${t.color}"
               data-id="${id}">
              ${t.emoji} ${t.name}
            </a>
          `;
        }).join('');

        sel.querySelectorAll('.type-pill').forEach((p) => {
          p.addEventListener('click', (e) => {
            // 让浏览器自然切 hash，但同时重新渲染
            setTimeout(() => renderContent(getActiveId()), 0);
          });
        });
      }

      function renderContent(id) {
        const t = TYPES[id];
        content.style.borderColor = t.color + '40';
        content.innerHTML = `
          <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem;flex-wrap:wrap;">
            <span style="font-size:3rem;">${t.emoji}</span>
            <div>
              <h2 style="color:${t.color};">${t.name}</h2>
              <div style="color:var(--color-text-soft);font-size:1rem;">${t.tagline}</div>
            </div>
          </div>
          <p class="guide-meta">${t.summary}</p>

          <div class="guide-block">
            <h3>🌿 典型特征</h3>
            <ul class="feature-list">
              ${t.features.map((f) => `<li>${f}</li>`).join('')}
            </ul>
          </div>

          <div class="guide-block">
            <h3>🌱 日常调养</h3>
            <ul class="advice-list">
              ${t.advice.map((a, i) => `<li data-num="${i + 1}"><span>${a}</span></li>`).join('')}
            </ul>
          </div>

          <div class="guide-block">
            <h3>🍵 匹配的养生品类</h3>
            <p style="color:var(--color-text-soft);font-size:.9375rem;margin-bottom:1rem;">
              ${t.name}人群常在以下品类中选择：
            </p>
            <div class="products-grid">
              ${t.products.map((p) => `<div class="product-chip">${p}</div>`).join('')}
            </div>
            <a href="quiz.html" class="btn btn-primary" style="margin-top:1.5rem;">测测我是这种体质？</a>
          </div>
        `;
      }

      function renderAll() {
        const active = getActiveId();
        renderSelector(active);
        renderContent(active);
      }

      renderAll();
      window.addEventListener('hashchange', renderAll);
    })();
  </script>
